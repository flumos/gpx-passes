<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bloom" cx="0.72" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2b2741"/>
      <stop offset="1" stop-color="#161826"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5abfc"/>
      <stop offset="1" stop-color="#9184d9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bloom)"/>
  <!-- hinterer Berg -->
  <path d="M 96 388 L 236 172 L 316 288 L 268 388 Z" fill="#5d5294" opacity="0.85"/>
  <!-- vorderer Berg mit Glow -->
  <path d="M 180 388 L 330 148 L 452 388 Z" fill="url(#front)" filter="url(#glow)"/>
  <!-- Pass-Scheitelpunkt -->
  <circle cx="330" cy="148" r="17" fill="#f5f4ff" stroke="#9184d9" stroke-width="9"/>
  <!-- Grundlinie (Straße) -->
  <path d="M 76 402 H 436" stroke="#423a6a" stroke-width="10" stroke-linecap="round"/>
</svg>
